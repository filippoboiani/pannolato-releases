<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pannolato</title>
<style>
  :root { --bg: #f6f7f9; --fg: #15171a; --muted: #5b6270; --accent: #2f6bff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111317; --fg: #eef0f3; --muted: #9aa1ad; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 12vh auto; padding: 0 16px; }
  h1 { font-size: 2.4rem; margin: 0 0 8px; }
  p { color: var(--muted); }
  .dl { display: flex; flex-wrap: wrap; gap: 12px; margin: 28px 0; }
  .dl a { background: var(--accent); color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; }
  small a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Pannolato</h1>
  <p>Indoor cycling trainer app. Alpha version: you need an access code to start it.</p>
  <div class="dl">
    <a href="https://pannolato-relay.pannolato.workers.dev/dl/mac">Download for macOS (Apple Silicon)</a>
    <a href="https://pannolato-relay.pannolato.workers.dev/dl/win">Download for Windows</a>
  </div>
  <small><a href="https://github.com/filippoboiani/pannolato-releases#readme">Install instructions</a></small>
</main>
</body>
</html>
